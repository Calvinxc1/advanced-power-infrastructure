schema: factorio_local_overlay
schema_version: 1
mod_name: advanced-power-infrastructure
canonical_agent_name: Advanced Power Infrastructure Factorio Modding Agent
workspace_path: /home/jcherry/Documents/git/factorio-mods/advanced-power-infrastructure
metadata_path: src/info.json
namespace_prefixes:
  - aer_
dependency_stack:
  - base >= 2.1.0
  - space-age >= 2.1.0
optional_dependencies:
  - advanced-fluid-infrastructure >= 0.0.1
  - advanced-energy-grid >= 0.0.1
  - RampantArsenalFork
  - Krastorio2
  - Krastorio2-spaced-out
  - space-exploration
upstream_or_fork_source: DanielWinks/Factorio-Advanced-Electric
scope_boundaries:
  - Owns expanded power generation and storage progression for Factorio 2.1 and Space Age.
  - Owns boilers, steam engines, steam turbines, heat exchangers, heat pipes, nuclear reactors, fusion power, solar panels, accumulators, and optional power-scoped fluidbox tuning when Advanced Fluid Infrastructure is installed.
  - Does not own electric grid infrastructure; Advanced Energy Grid owns that scope.
  - Does not own fluid pipe and pump infrastructure; Advanced Fluid Infrastructure owns that scope.
release_target: Factorio 2.1 and Space Age mod releases under the Advanced Power Infrastructure name.
changelog_format: Factorio mod portal changelog.txt format at src/changelog.txt.
validation_available:
  json: true
  lua_syntax: true
  lint: false
  format: false
  factorio_load: true
workspace_specific_rules:
  - "Krastorio 2 (? Krastorio2, and Spaced Out through it) and Space Exploration (? space-exploration) are optional dependencies (Jason, 2026-09-26). Under an overhaul energy follows the overhaul and temperature stays this mod's: src/prototypes/power/energy-scale.lua (data-final-fixes, after SE's own final fixes) rebuilds every tier from the figures src/prototypes/power/energy-reference.lua records at the end of the data stage, scaling each family by whatever the overhaul made of its first rung (K2: 250 MW reactor, 50 MW exchanger, 10 MW turbine, 1.5 MW boiler, 0.75 MW engine, 100 kW solar panel, 10 MJ accumulator) and setting temperatures, ceilings, gradients and neighbour_bonus back. Heat buffers (specific heat, max_transfer) scale with exchanger draw, which the energy_scale harness experiment showed leaves a loaded run's temperature profile unchanged (within 0.6 degrees at 5x, also with K2 loaded). In a load with no overhaul every factor is 1 and nothing changes."
  - "Space Exploration's high-temperature chain (antimatter reactor, big heat exchanger, naquium heat pipe) stays SE's own and is not linked into these ladders (Jason, 2026-09-26). SE's condenser turbine mirrors the vanilla steam turbine by SE's own design in space-exploration-postprocess, so it inherits the mk1 turbine's figures."
  - "control.lua counts every steam-producing boiler prototype as a fixed-temperature source when rewriting a segment, not only this mod's, so an overhaul's boiler sharing a header with this mod's exchangers keeps its vote (foreign_steam_source harness experiment). Every aer_ technology waits on whatever unlocks its recipes' ingredients (src/prototypes/power/technology-fixes.lua). scripts/validate-overhauls.sh, run in CI, loads the mod with K2 Spaced Out, K2, SE and SE with K2 and the tests/fixtures/api-energy-scale-test invariants."
  - Preserve the repo-local aer_ custom prototype ID namespace unless an intentional migration plan is part of the task.
  - Keep lifecycle entrypoints shallow in src/data.lua, src/data-updates.lua, and src/data-final-fixes.lua.
  - Keep power prototype logic organized under src/prototypes/power by system.
  - Do not move electric-grid or fluid-pipe ownership back into this mod without explicit scope approval.
migration_notes:
  - Ported from the original 0.16-era source toward Factorio 2.1 and Space Age progression.
  - Electric grid infrastructure was split into Advanced Energy Grid.
  - Fluid pipe and pump infrastructure was moved to optional Advanced Fluid Infrastructure integration.
  - Current balance values are functional but experimental.
  - Long-running save upgrade paths and replace groups still need validation.
notes: Filled from src/info.json, README.md, src/changelog.txt, and local validation scripts. Do not put secrets or credentials here.
