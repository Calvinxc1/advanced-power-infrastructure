id: execution
status: active
summary: Command and file-edit execution policy.
rules:
  - Inspect current worktree state before broad edits.
  - Use `rg` or `rg --files` for repository searches when available.
  - Use `apply_patch` for targeted manual edits when practical.
  - Do not run long Factorio sessions or external tools without explaining the purpose first.
  - Do not vendor downloaded mods or generated build artifacts into the repository unless requested.
  - Keep command output focused on actionable findings.
