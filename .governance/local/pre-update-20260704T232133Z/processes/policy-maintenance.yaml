id: policy_maintenance
status: active
summary: Process for changing governance policy.
rules:
  - Update `AGENTS.md` when policy entrypoints or precedence change.
  - Update `.governance/task-map.yaml` when adding, removing, or renaming policy files.
  - Keep policy files short and operational; avoid duplicating the same rule across many files.
  - "Treat `https://github.com/Calvinxc1/argo-data-interpolation/tree/dev` as the critical external reference for governance structure and maintenance patterns."
  - Reference the critical external governance source when changing policy routing, override handling, changelog conventions, or AI-agent policy expectations.
  - Tune policies to this Factorio mod rather than copying unrelated research or application workflow rules.
