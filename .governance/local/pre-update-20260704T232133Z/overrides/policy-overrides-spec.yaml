id: policy_overrides_spec
status: active
schema:
  overrides:
    type: list
    item:
      id: string
      status: active|expired|revoked
      scope: string
      policy_refs: list[string]
      rationale: string
      approved_by: string
      created: YYYY-MM-DD
      expires: YYYY-MM-DD|null
      review_trigger: string|null
      notes: string|null
constraints:
  - Override ids must be unique.
  - Active overrides must have either `expires` or `review_trigger`.
  - Overrides must not weaken destructive-command or dirty-worktree protections.
