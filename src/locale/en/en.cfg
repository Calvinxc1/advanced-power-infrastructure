[technology-description]
aer_steam-engine=Allows access to additional ranks of Steam Engines.
aer_steel-steam-engine=Unlocks steel steam engines.
aer_rubber-lined-steam-turbine=Unlocks production-tier steam turbines using rubber-lined fluid handling.
aer_reinforced-steam-turbine=Unlocks reinforced steam turbines with hardened resistances and higher steam throughput.
aer_foundation-steam-turbine=Unlocks endgame steam turbines using foundation-grade fluid infrastructure.
aer_boiler=Allows access to additional ranks of Boilers.
aer_steel-boiler=Unlocks steel boilers.
aer_rubber-lined-boiler=Unlocks rubber-lined boilers.
aer_rubber-lined-steam-engine=Unlocks rubber-lined steam engines.
aer_holmium-reinforced-boiler=Unlocks Fulgora-tier boilers lined with holmium solution.
aer_holmium-steam-engine=Unlocks Fulgora-tier steam engines built with holmium plates and processing units.
aer_heat-exchanger-2=Unlocks rubber-lined heat exchangers for production-tier nuclear steam.
aer_heat-exchanger-3=Unlocks reinforced heat exchangers with hardened resistances and hotter nuclear steam.
aer_heat-exchanger-4=Unlocks foundation heat exchangers for Aquilo-tier nuclear steam.
aer_heat-pipe-2=Unlocks tempered heat pipes made with Nauvis-grade thermal materials.
aer_heat-pipe-3=Unlocks high-flux heat pipes using Vulcanus and Fulgora materials.
aer_heat-pipe-4=Unlocks superconducting heat pipes using Fulgora and Aquilo materials.
aer_nuclear-reactor-2=Unlocks hardened reactors with higher heat throughput.
aer_nuclear-reactor-3=Unlocks intensified reactors for cross-planet nuclear heat generation.
aer_nuclear-reactor-4=Unlocks supercritical reactors for late-game nuclear heat output.
aer_promethium-fusion-reactor=Unlocks promethium-tier fusion reactors with foundation-grade fluid capacity.
aer_promethium-fusion-generator=Unlocks promethium-tier fusion generators with foundation-grade fluid capacity.
aer_holmium-solar-panel=Unlocks Fulgora-tier solar panels with four times the output of stock panels.
aer_cryogenic-solar-panel=Unlocks Aquilo-tier solar panels with eight times the output of stock panels.
aer_holmium-accumulator=Unlocks Fulgora-tier accumulators with four times the storage of stock accumulators.
aer_cryogenic-accumulator=Unlocks Aquilo-tier accumulators with eight times the storage of stock accumulators.

