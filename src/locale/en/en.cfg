[technology-description]
aer_steam-engine=Allows access to additional ranks of Steam Engines.
aer_steel-steam-engine=Unlocks steel steam engines.
aer_rubber-lined-steam-turbine=Unlocks novice late-game steam turbines using rubber-lined fluid infrastructure.
aer_reinforced-steam-turbine=Unlocks cross-planet steam turbines using reinforced fluid infrastructure.
aer_foundation-steam-turbine=Unlocks endgame steam turbines using foundation-grade fluid infrastructure.
aer_boiler=Allows access to additional ranks of Boilers.
aer_steel-boiler=Unlocks steel boilers.
aer_steel-pipe-infrastructure=Unlocks steel pipes with higher pipeline extent and longer underground reach.
aer_steel-pump-infrastructure=Unlocks steel pumps and offshore pumps with higher pumping speed.
aer_low-pressure-steel-pipe-infrastructure=Unlocks steel-stat pipes adapted for space platforms.
aer_low-pressure-steel-pump-infrastructure=Unlocks steel-stat pumps adapted for space platforms.
aer_tungsten-pipe-infrastructure=Unlocks steel-stat tungsten pipes for Vulcanus.
aer_tungsten-pump-infrastructure=Unlocks steel-stat tungsten pumps and lava offshore pumps for Vulcanus.
aer_reinforced-pipe-infrastructure=Unlocks carbon-fiber reinforced pipes with extended pipeline reach and hardened resistances.
aer_reinforced-pump-infrastructure=Unlocks carbon-fiber reinforced pumps and offshore pumps with extended pipeline reach and hardened resistances.
aer_foundation-pipe-infrastructure=Unlocks endgame foundation pipes with beyond-vanilla pipeline extent.
aer_foundation-pump-infrastructure=Unlocks endgame foundation pumps and offshore pumps with high pumping speed.
aer_high-pressure-foundation-pumping=Unlocks promethium-driven foundation pumps for postgame fluid backbone compression.
aer_rubber-lined-boiler=Unlocks rubber-lined boilers.
aer_rubber-lined-steam-engine=Unlocks rubber-lined steam engines.
aer_holmium-reinforced-boiler=Unlocks Fulgora-tier boilers lined with holmium solution.
aer_holmium-steam-engine=Unlocks Fulgora-tier steam engines built with holmium plates and processing units.
aer_rubber-lined-pipe-infrastructure=Unlocks rubber-lined pipes with higher pipeline extent and longer underground reach.
aer_rubber-lined-pump-infrastructure=Unlocks rubber-lined pumps and offshore pumps with higher pumping speed.
electric-pole=Allows access to additional ranks of Small, Medium, and Big Electric Poles.
aer_improved-electric-poles=Improves early electric pole reach and coverage.
electric-energy-distribution-1=Splits basic pole progression into local distribution and distance transmission branches.
electric-energy-distribution-2=Unlocks the first improved local distribution substation.
aer_local-energy-distribution-improved=Improves local factory power distribution.
aer_local-energy-distribution-advanced=Further improves local factory power distribution.
aer_local-energy-distribution-elite=Maximizes local factory power distribution.
aer_distance-power-transmission-improved=Improves long-range power transmission.
aer_distance-power-transmission-advanced=Further improves long-range power transmission.
aer_distance-power-transmission-elite=Maximizes long-range power transmission.
electric-substation=Allows access to additional ranks of Substations.
aer_improved-local-energy-distribution-improved=Improves dense local factory power coverage.
aer_improved-local-energy-distribution-advanced=Further improves dense local factory power coverage.
aer_improved-local-energy-distribution-elite=Maximizes dense local factory power coverage.
aer_heat-exchanger-2=Unlocks rubber-lined heat exchangers for novice late-game nuclear steam.
aer_heat-exchanger-3=Unlocks reinforced heat exchangers using Vulcanus and Gleba materials.
aer_heat-exchanger-4=Unlocks foundation heat exchangers for Aquilo-tier nuclear steam.
aer_heat-pipe-2=Unlocks tempered heat pipes made with Nauvis-grade thermal materials.
aer_heat-pipe-3=Unlocks high-flux heat pipes using Vulcanus and Fulgora materials.
aer_heat-pipe-4=Unlocks superconducting heat pipes using Fulgora and Aquilo materials.
aer_nuclear-reactor-2=Unlocks hardened reactors with higher heat throughput.
aer_nuclear-reactor-3=Unlocks intensified reactors for cross-planet nuclear heat generation.
aer_nuclear-reactor-4=Unlocks supercritical reactors for late-game nuclear heat output.
aer_promethium-fusion-reactor=Unlocks promethium-tier fusion reactors with foundation-grade fluid capacity.
aer_promethium-fusion-generator=Unlocks promethium-tier fusion generators with foundation-grade fluid capacity.
aer_holmium-solar-panel=Unlocks Fulgora-tier solar panels with four times the output of stock panels.
aer_cryogenic-solar-panel=Unlocks Aquilo-tier solar panels with eight times the output of stock panels.
aer_holmium-accumulator=Unlocks Fulgora-tier accumulators with four times the storage of stock accumulators.
aer_cryogenic-accumulator=Unlocks Aquilo-tier accumulators with eight times the storage of stock accumulators.
aer_improved-distance-power-transmission-improved=Improves long-range huge pole transmission.
aer_improved-distance-power-transmission-advanced=Further improves long-range huge pole transmission.
aer_improved-distance-power-transmission-elite=Maximizes long-range huge pole transmission.
po-electric-energy-distribution-3=Unlocks the first huge electric pole for long-range transmission.

